[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "olist-cdc-lakehouse"
version = "0.1.0"
description = "Local lakehouse on Olist e-commerce data: batch and CDC ingestion, dbt, Airflow."
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
dependencies = [
    "psycopg[binary]>=3.2,<4",
    "polars>=1.20,<3",
    "pyarrow>=17",
    "deltalake>=1.0,<2",
    "python-dotenv>=1.0",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.17,<0.18",
    "pre-commit>=3.7",
    "dbt-core>=1.10,<2",
    "dbt-duckdb>=1.10,<2",
    "duckdb>=1.3,<3",
    "kaggle>=1.6",
    "six",  # kaggle 2.x imports six without declaring it (breaks on Python 3.12+)
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
extend-exclude = ["dbt/olist/dbt_packages", "dbt/olist/target", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["src", "airflow/plugins", "scripts"]
