# CDC overlay: Kafka (KRaft, one broker), Kafka Connect with Debezium, Spark streaming.
# Use together with the base file, e.g. `make cdc-up`:
#   docker compose -f docker-compose.yml -f docker-compose.cdc.yml up -d
# Ports bind to 127.0.0.1 only: Kafka and the Connect REST API have no authentication.

services:
  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:29092:29092"   # from the host: localhost:29092
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
    mem_limit: 1g
    restart: unless-stopped

  connect:
    image: quay.io/debezium/connect:2.7.3.Final
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: olist-connect
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_status
      HEAP_OPTS: "-Xms256m -Xmx768m"
    ports:
      - "127.0.0.1:8083:8083"     # Kafka Connect REST API
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8083/connectors > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30
    mem_limit: 1g
    restart: unless-stopped

  spark:
    build: ./infra/spark
    image: olist-spark:local
    user: "${AIRFLOW_UID:-50000}:0"
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - spark-submit
      - --master
      - local[2]
      - --driver-memory
      - 1g
      - --conf
      - spark.jars.ivy=/opt/ivy
      - --conf
      - spark.jars.repositories=https://maven-central.storage-download.googleapis.com/maven2/
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.3
      - /opt/project/streaming/cdc_to_bronze.py
    working_dir: /opt/project
    environment:
      PYTHONPATH: /opt/project/src
      LAKE_ROOT: /opt/project/data/lake
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - ./:/opt/project
    mem_limit: 2g
    restart: unless-stopped

  airflow:
    environment:
      CONNECT_URL: http://connect:8083
