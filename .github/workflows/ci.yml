name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:      # tombol "Run workflow" manual di tab Actions

permissions:
  contents: read          # token CI cuma bisa baca repo, gak bisa nulis

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true  # push baru ke PR yang sama membatalkan run lama

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: pytest